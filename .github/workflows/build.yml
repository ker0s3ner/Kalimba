name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read JDK version
        id: versions
        run: echo "jdk=$(sed -n 's/^jdk[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' gradle/libs.versions.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.jdk }}

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('src-theme/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        env:
          CI: true
        run: ./gradlew build -x test -x detekt

      - name: Collect jar
        run: |
          mkdir -p dist
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources*' ! -name '*-dev*' -exec cp {} dist/ \;
          ls -l dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Kalimba-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error

      - name: Attach jar to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.jar --clobber
